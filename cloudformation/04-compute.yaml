AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  SATC e-commerce platform - Stack 4 of 7: compute and API tier. Internet-facing ALB with WAF, EC2 launch
  template (t3.micro, Amazon Linux 2023, IMDSv2, encrypted gp3), Auto Scaling group across two AZs with
  target-tracking (CPU 70 %, 1000 requests/target) or simple +1/-1 scaling, Lambda order/product functions
  with a psycopg2 layer, API Gateway REST API with Cognito authoriser, request validation and throttling,
  and an SQS dead-letter queue. Package with "aws cloudformation package" before deploying.

Parameters:
  ProjectName:
    Type: String
    Default: satc
  EnvName:
    Type: String
    Default: lab
    AllowedValues: [lab, staging, prod]
  CreateIamRoles:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 (Free Tier eligible, AWS-maintained, SSM agent pre-installed)
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t2.micro, t3.small]
  AsgMinSize:
    Type: Number
    Default: 2
  AsgDesiredCapacity:
    Type: Number
    Default: 2
  AsgMaxSize:
    Type: Number
    Default: 4
  ScalingMode:
    Type: String
    Default: target-tracking
    AllowedValues: [target-tracking, step]
    Description: target-tracking = CPU 70 % and 1000 requests/target; step = +1 / -1 instance with 300 s cooldown
  CertificateArn:
    Type: String
    Default: ""
    Description: Optional ACM certificate for HTTPS on the ALB. Leave blank in the lab (CloudFront terminates HTTPS).
  RedisHost:
    Type: String
    Default: ""
    Description: Redis primary endpoint from the data stack (CreateRedis=true). Blank = the app runs without a cache.
  KeyPairName:
    Type: String
    Default: ""
    Description: Optional EC2 key pair for SSH over the admin VPN. Leave blank to use SSM Session Manager only.

Conditions:
  CreateRoles: !Equals [!Ref CreateIamRoles, "true"]
  HasCert: !Not [!Equals [!Ref CertificateArn, ""]]
  NoCert: !Equals [!Ref CertificateArn, ""]
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, ""]]
  TargetMode: !Equals [!Ref ScalingMode, target-tracking]
  StepMode: !Equals [!Ref ScalingMode, step]

Mappings:
  ElbLogAccount:   # regional Elastic Load Balancing account that writes ALB access logs
    us-east-1: { Id: "127311923021" }
    us-west-2: { Id: "797873946194" }
    eu-west-1: { Id: "156460612806" }
    af-south-1: { Id: "098369216593" }

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 256
    Timeout: 10
    Tracing: Active
    Environment:
      Variables:
        PRODUCTS_TABLE: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-ProductsTable" }
        INVENTORY_TABLE: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-InventoryTable" }
        LOG_LEVEL: INFO

Resources:
  # ================================================================ ALB
  AlbLogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${EnvName}-alblogs-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }   # ALB log delivery supports SSE-S3 only
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - { Id: expire, Status: Enabled, ExpirationInDays: 90 }
  AlbLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AlbLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowElbLogDelivery
            Effect: Allow
            Principal: { AWS: !Sub ["arn:aws:iam::${Acct}:root", { Acct: !FindInMap [ElbLogAccount, !Ref "AWS::Region", Id] }] }
            Action: s3:PutObject
            Resource: !Sub "${AlbLogBucket.Arn}/alb/AWSLogs/${AWS::AccountId}/*"
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: AlbLogBucketPolicy
    Properties:
      Name: !Sub "${ProjectName}-${EnvName}-alb"
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Split [",", !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-PublicSubnetIds" }]
      SecurityGroups: [!ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-AlbSgId" }]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: idle_timeout.timeout_seconds, Value: "60" }
        - { Key: access_logs.s3.enabled, Value: "true" }
        - { Key: access_logs.s3.bucket, Value: !Ref AlbLogBucket }
        - { Key: access_logs.s3.prefix, Value: alb }
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${EnvName}-tg"
      VpcId: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-VpcId" }
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }
        - { Key: stickiness.enabled, Value: "false" }
  HttpListenerForward:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: NoCert
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]
  HttpListenerRedirect:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCert
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCert
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]
  AlbWafAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref Alb
      WebACLArn: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-RegionalWebAclArn" }

  # ================================================================ EC2 launch template and Auto Scaling
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${ProjectName}/${EnvName}/ec2/app"
      RetentionInDays: 30
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectName}-${EnvName}-web-lt"
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref AWS::NoValue]
        IamInstanceProfile:
          Name: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-Ec2InstanceProfile" }
        SecurityGroupIds: [!ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-AppSgId" }]
        MetadataOptions:
          HttpTokens: required          # IMDSv2 only (blocks SSRF credential theft)
          HttpPutResponseHopLimit: 1
          HttpEndpoint: enabled
        Monitoring: { Enabled: false }  # basic 5-min metrics are free; CloudWatch agent sends 60 s custom metrics
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: 8
              Iops: 3000                # gp3 baseline, included in the price; app is not I/O bound
              Throughput: 125
              Encrypted: true           # AWS-managed aws/ebs key (works with the Auto Scaling service-linked role)
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-web" }
              - { Key: Environment, Value: !Ref EnvName }
          - ResourceType: volume
            Tags:
              - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-web-root" }
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              set -euxo pipefail
              dnf -y update
              dnf -y install python3-pip amazon-cloudwatch-agent ruby wget
              # --- CodeDeploy agent (used by the CI/CD pipeline)
              cd /tmp && wget -q https://aws-codedeploy-${AWS::Region}.s3.${AWS::Region}.amazonaws.com/latest/install
              chmod +x ./install && ./install auto || true
              # --- application runtime: same code that CodeDeploy deploys (uploaded by scripts/deploy.sh)
              useradd --system --home /opt/satc satc || true
              mkdir -p /opt/satc /var/log/satc && chown satc:satc /var/log/satc
              aws s3 cp s3://${ProjectName}-${EnvName}-packages-${AWS::AccountId}/web/ /opt/satc/ --recursive
              pip3 install -r /opt/satc/requirements.txt
              cat > /etc/systemd/system/satc.service <<'UNIT'
              [Unit]
              Description=SATC web application
              After=network.target
              [Service]
              User=satc
              AmbientCapabilities=CAP_NET_BIND_SERVICE
              Environment=AWS_REGION=${AWS::Region}
              Environment=PRODUCTS_TABLE=${ProductsTable}
              Environment=REDIS_HOST=${RedisHost}
              WorkingDirectory=/opt/satc
              ExecStart=/usr/local/bin/gunicorn -w 2 -b 0.0.0.0:80 --access-logfile /var/log/satc/app.log app:app
              Restart=always
              [Install]
              WantedBy=multi-user.target
              UNIT
              systemctl daemon-reload && systemctl enable --now satc
              # --- CloudWatch agent: memory and disk (custom metrics) + app log shipping
              cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<'CW'
              {
                "agent": { "metrics_collection_interval": 60 },
                "metrics": {
                  "namespace": "CWAgent",
                  "append_dimensions": { "AutoScalingGroupName": "${!aws:AutoScalingGroupName}", "InstanceId": "${!aws:InstanceId}" },
                  "aggregation_dimensions": [["AutoScalingGroupName"]],
                  "metrics_collected": {
                    "mem":  { "measurement": ["mem_used_percent"] },
                    "disk": { "measurement": ["used_percent"], "resources": ["/"] }
                  }
                },
                "logs": { "logs_collected": { "files": { "collect_list": [
                  { "file_path": "/var/log/satc/app.log", "log_group_name": "${LogGroup}", "log_stream_name": "{instance_id}" }
                ] } } }
              }
              CW
              /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 \
                -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s
            - ProductsTable: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-ProductsTable" }
              LogGroup: !Ref AppLogGroup
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "${ProjectName}-${EnvName}-web-asg"
      MinSize: !Ref AsgMinSize
      MaxSize: !Ref AsgMaxSize
      DesiredCapacity: !Ref AsgDesiredCapacity
      VPCZoneIdentifier: !Split [",", !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-AppSubnetIds" }]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      DefaultInstanceWarmup: 300
      Cooldown: "300"
      MetricsCollection:
        - Granularity: 1Minute
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-web", PropagateAtLaunch: true }
        - { Key: Environment, Value: !Ref EnvName, PropagateAtLaunch: true }
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT5M
        WaitOnResourceSignals: false

  # target-tracking mode (default)
  CpuTargetTracking:
    Type: AWS::AutoScaling::ScalingPolicy
    Condition: TargetMode
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 300
      TargetTrackingConfiguration:
        PredefinedMetricSpecification: { PredefinedMetricType: ASGAverageCPUUtilization }
        TargetValue: 70
  RequestCountTargetTracking:
    Type: AWS::AutoScaling::ScalingPolicy
    Condition: TargetMode
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 300
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Sub "${Alb.LoadBalancerFullName}/${TargetGroup.TargetGroupFullName}"
        TargetValue: 1000

  # step mode: +1 / -1 instance, 300 s cooldown
  ScaleOutPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Condition: StepMode
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: SimpleScaling
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: 1
      Cooldown: "300"
  ScaleInPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Condition: StepMode
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: SimpleScaling
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: -1
      Cooldown: "300"
  CpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: StepMode
    Properties:
      AlarmName: !Sub "${ProjectName}-${EnvName}-asg-cpu-high"
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{ Name: AutoScalingGroupName, Value: !Ref AutoScalingGroup }]
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 70
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref ScaleOutPolicy]
  CpuLowAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: StepMode
    Properties:
      AlarmName: !Sub "${ProjectName}-${EnvName}-asg-cpu-low"
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{ Name: AutoScalingGroupName, Value: !Ref AutoScalingGroup }]
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      Threshold: 30
      ComparisonOperator: LessThanThreshold
      AlarmActions: [!Ref ScaleInPolicy]

  # ================================================================ Lambda (serverless order processing)
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${EnvName}-orders-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  PsycopgLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${ProjectName}-${EnvName}-psycopg2"
      Description: psycopg2-binary PostgreSQL driver (built by scripts/build_layer.sh)
      ContentUri: ../build/layers/psycopg
      CompatibleRuntimes: [python3.12]
      RetentionPolicy: Delete
  ProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvName}-products"
      Description: GET /api/products and /api/products/{productId} - catalogue reads from DynamoDB
      CodeUri: ../app/lambda/products/
      Handler: handler.lambda_handler
      Role: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-LambdaRoleArn" }
  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvName}-orders"
      Description: POST /api/orders - reserves stock in DynamoDB and writes the order to RDS PostgreSQL
      CodeUri: ../app/lambda/orders/
      Handler: handler.lambda_handler
      Timeout: 15
      Role: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-LambdaRoleArn" }
      Layers: [!Ref PsycopgLayer]
      VpcConfig:
        SubnetIds: !Split [",", !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-AppSubnetIds" }]
        SecurityGroupIds: [!ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-LambdaSgId" }]
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt DeadLetterQueue.Arn
      Environment:
        Variables:
          DB_HOST: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-DbEndpoint" }
          DB_NAME: satc
          DB_SECRET_ARN: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-DbSecretArn" }
          METRICS_NAMESPACE: !Sub "SATC/${EnvName}"
  ProductsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${EnvName}-products"
      RetentionInDays: 30
  OrdersLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${EnvName}-orders"
      RetentionInDays: 30

  # ================================================================ API Gateway (REST)
  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-${EnvName}-api"
      EndpointConfiguration: { Types: [REGIONAL] }
      Body:
        openapi: "3.0.1"
        info: { title: !Sub "${ProjectName}-${EnvName}-api", version: "1.0" }
        x-amazon-apigateway-request-validators:
          body-and-params: { validateRequestBody: true, validateRequestParameters: true }
        components:
          securitySchemes:
            CognitoAuth:
              type: apiKey
              name: Authorization
              in: header
              x-amazon-apigateway-authtype: cognito_user_pools
              x-amazon-apigateway-authorizer:
                type: cognito_user_pools
                providerARNs: [!ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-UserPoolArn" }]
          schemas:
            OrderRequest:
              type: object
              required: [items, shippingCountry]
              additionalProperties: false
              properties:
                shippingCountry: { type: string, pattern: "^[A-Z]{2}$" }
                paymentMethod: { type: string, enum: [card, mobile_money] }
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [sku, quantity]
                    additionalProperties: false
                    properties:
                      sku: { type: string, pattern: "^[A-Z0-9-]{3,20}$" }
                      quantity: { type: integer, minimum: 1, maximum: 50 }
        paths:
          /api/health:
            get:
              responses: { "200": { description: OK } }
              x-amazon-apigateway-integration:
                type: mock
                requestTemplates: { application/json: '{"statusCode": 200}' }
                responses: { default: { statusCode: "200", responseTemplates: { application/json: '{"status":"ok"}' } } }
          /api/products:
            get:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductsFunction.Arn}/invocations"
          /api/products/{productId}:
            get:
              parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
              x-amazon-apigateway-request-validator: body-and-params
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductsFunction.Arn}/invocations"
          /api/orders:
            post:
              security: [{ CognitoAuth: [] }]
              x-amazon-apigateway-request-validator: body-and-params
              requestBody:
                required: true
                content: { application/json: { schema: { $ref: "#/components/schemas/OrderRequest" } } }
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrdersFunction.Arn}/invocations"
  ProductsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProductsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/GET/api/products*"
  OrdersInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrdersFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/POST/api/orders"

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: apigateway.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs]
  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Condition: CreateRoles
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${ProjectName}/${EnvName}/apigw/access"
      RetentionInDays: 30
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    Properties:
      RestApiId: !Ref Api
      Description: Initial deployment
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref ApiDeployment
      StageName: prod
      TracingEnabled: true
      AccessLogSetting: !If
        - CreateRoles
        - DestinationArn: !GetAtt ApiAccessLogGroup.Arn
          Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency","integrationLatencyMs":"$context.integrationLatency","wafStatus":"$context.wafResponseCode","userAgent":"$context.identity.userAgent"}'
        - !Ref AWS::NoValue
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
          MetricsEnabled: true
          LoggingLevel: !If [CreateRoles, INFO, "OFF"]
          DataTraceEnabled: false
  ApiWafAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn: ApiStage
    Properties:
      ResourceArn: !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/${Api}/stages/prod"
      WebACLArn: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-RegionalWebAclArn" }
  PartnerUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiStage
    Properties:
      UsagePlanName: !Sub "${ProjectName}-${EnvName}-partners"
      Description: Shipping and wholesale partners - per-key rate limit and daily quota
      ApiStages: [{ ApiId: !Ref Api, Stage: prod }]
      Throttle: { RateLimit: 10, BurstLimit: 20 }
      Quota: { Limit: 10000, Period: DAY }
  PartnerApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: ApiStage
    Properties:
      Name: !Sub "${ProjectName}-${EnvName}-shipping-partner"
      Enabled: true
  PartnerUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref PartnerApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref PartnerUsagePlan

Outputs:
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
    Export: { Name: !Sub "${ProjectName}-${EnvName}-AlbDnsName" }
  AlbFullName:
    Value: !GetAtt Alb.LoadBalancerFullName
    Export: { Name: !Sub "${ProjectName}-${EnvName}-AlbFullName" }
  TargetGroupFullName:
    Value: !GetAtt TargetGroup.TargetGroupFullName
    Export: { Name: !Sub "${ProjectName}-${EnvName}-TgFullName" }
  TargetGroupName:
    Value: !GetAtt TargetGroup.TargetGroupName
    Export: { Name: !Sub "${ProjectName}-${EnvName}-TgName" }
  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup
    Export: { Name: !Sub "${ProjectName}-${EnvName}-AsgName" }
  ApiId:
    Value: !Ref Api
    Export: { Name: !Sub "${ProjectName}-${EnvName}-ApiId" }
  ApiDomain:
    Value: !Sub "${Api}.execute-api.${AWS::Region}.amazonaws.com"
    Export: { Name: !Sub "${ProjectName}-${EnvName}-ApiDomain" }
  ApiInvokeUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod/api/products"
  OrdersFunctionName:
    Value: !Ref OrdersFunction
    Export: { Name: !Sub "${ProjectName}-${EnvName}-OrdersFunction" }
  ProductsFunctionName:
    Value: !Ref ProductsFunction
    Export: { Name: !Sub "${ProjectName}-${EnvName}-ProductsFunction" }
  DeadLetterQueueName:
    Value: !GetAtt DeadLetterQueue.QueueName
    Export: { Name: !Sub "${ProjectName}-${EnvName}-DlqName" }

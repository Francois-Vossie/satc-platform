AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SATC e-commerce platform - Stack 7 of 7: CI/CD. CodePipeline (V2) with GitHub source via CodeConnections,
  CodeBuild (lint, security scan, unit tests, packaging), CodeDeploy in-place deployment to staging, manual
  approval, and CodeDeploy blue/green deployment to production with alarm-based automatic rollback.

Parameters:
  ProjectName:
    Type: String
    Default: satc
  EnvName:
    Type: String
    Default: lab
    AllowedValues: [lab, staging, prod]
  GitHubOwner:
    Type: String
    Description: GitHub user or organisation that owns the repository
  GitHubRepo:
    Type: String
    Default: satc-platform
  GitHubBranch:
    Type: String
    Default: main
  CreateIamRoles:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  StagingAsgName:
    Type: String
    Default: ""
    Description: ASG of the staging environment. Leave blank in the lab to reuse the lab ASG for the staging stage.

Conditions:
  CreateRoles: !Equals [!Ref CreateIamRoles, "true"]
  SameAsgForStaging: !Equals [!Ref StagingAsgName, ""]

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${EnvName}-artifacts-${AWS::AccountId}"
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: "aws:kms"
              KMSMasterKeyID: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-KmsKeyArn" }
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - { Id: expire-artefacts, Status: Enabled, ExpirationInDays: 30, NoncurrentVersionExpiration: { NoncurrentDays: 7 } }

  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: !Sub "${ProjectName}-${EnvName}-github"
      ProviderType: GitHub

  # ================================================================ roles (skipped in the Learner Lab - LabRole is used)
  CodeBuildRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: codebuild.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: codebuild
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
              - Effect: Allow
                Action: ["s3:GetObject", "s3:PutObject", "s3:GetObjectVersion"]
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action: ["codebuild:CreateReportGroup", "codebuild:CreateReport", "codebuild:UpdateReport", "codebuild:BatchPutTestCases"]
                Resource: !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/*"
              - Effect: Allow
                Action: ["kms:Decrypt", "kms:GenerateDataKey"]
                Resource: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-KmsKeyArn" }
  CodeDeployRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: codedeploy.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSCodeDeployRole]
      Policies:
        - PolicyName: blue-green-launch-template
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["iam:PassRole", "ec2:RunInstances", "ec2:CreateTags"]
                Resource: "*"
  PipelineRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: codepipeline.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["s3:GetObject", "s3:PutObject", "s3:GetObjectVersion", "s3:GetBucketVersioning"]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
              - Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref GitHubConnection
              - Effect: Allow
                Action: ["codebuild:StartBuild", "codebuild:BatchGetBuilds"]
                Resource: !GetAtt BuildProject.Arn
              - Effect: Allow
                Action: ["codedeploy:CreateDeployment", "codedeploy:GetDeployment", "codedeploy:GetApplication",
                         "codedeploy:GetApplicationRevision", "codedeploy:RegisterApplicationRevision",
                         "codedeploy:GetDeploymentConfig"]
                Resource: "*"
              - Effect: Allow
                Action: sns:Publish
                Resource: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-AlertTopicArn" }
              - Effect: Allow
                Action: ["kms:Decrypt", "kms:GenerateDataKey"]
                Resource: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-KmsKeyArn" }

  # ================================================================ build
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectName}-${EnvName}-build"
      Description: Lint (flake8, cfn-lint), security scan (bandit), pytest unit tests, package web bundle and Lambda code
      ServiceRole: !If [CreateRoles, !GetAtt CodeBuildRole.Arn, !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"]
      Source: { Type: CODEPIPELINE, BuildSpec: buildspec.yml }
      Artifacts: { Type: CODEPIPELINE }
      EncryptionKey: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-KmsKeyArn" }
      TimeoutInMinutes: 20
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: false
        EnvironmentVariables:
          - { Name: ENV_NAME, Value: !Ref EnvName }
      LogsConfig:
        CloudWatchLogs: { Status: ENABLED, GroupName: !Sub "/aws/codebuild/${ProjectName}-${EnvName}" }

  # ================================================================ deploy
  DeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub "${ProjectName}-${EnvName}-web"
      ComputePlatform: Server
  StagingDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref DeployApplication
      DeploymentGroupName: staging
      ServiceRoleArn: !If [CreateRoles, !GetAtt CodeDeployRole.Arn, !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"]
      DeploymentConfigName: CodeDeployDefault.OneAtATime
      AutoScalingGroups:
        - !If [SameAsgForStaging, !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-AsgName" }, !Ref StagingAsgName]
      DeploymentStyle: { DeploymentType: IN_PLACE, DeploymentOption: WITH_TRAFFIC_CONTROL }
      LoadBalancerInfo:
        TargetGroupInfoList: [{ Name: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-TgName" } }]
      AutoRollbackConfiguration: { Enabled: true, Events: [DEPLOYMENT_FAILURE] }
  ProductionDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref DeployApplication
      DeploymentGroupName: production
      ServiceRoleArn: !If [CreateRoles, !GetAtt CodeDeployRole.Arn, !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"]
      DeploymentConfigName: CodeDeployDefault.HalfAtATime
      AutoScalingGroups: [!ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-AsgName" }]
      DeploymentStyle: { DeploymentType: BLUE_GREEN, DeploymentOption: WITH_TRAFFIC_CONTROL }
      BlueGreenDeploymentConfiguration:
        GreenFleetProvisioningOption: { Action: COPY_AUTO_SCALING_GROUP }
        DeploymentReadyOption: { ActionOnTimeout: CONTINUE_DEPLOYMENT, WaitTimeInMinutes: 0 }
        TerminateBlueInstancesOnDeploymentSuccess: { Action: TERMINATE, TerminationWaitTimeInMinutes: 60 }
      LoadBalancerInfo:
        TargetGroupInfoList: [{ Name: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-TgName" } }]
      AlarmConfiguration:
        Enabled: true
        Alarms:
          - Name: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-AlbErrorAlarm" }
          - Name: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-AlbLatencyAlarm" }
      AutoRollbackConfiguration:
        Enabled: true
        Events: [DEPLOYMENT_FAILURE, DEPLOYMENT_STOP_ON_ALARM]

  # ================================================================ pipeline
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${ProjectName}-${EnvName}-pipeline"
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn: !If [CreateRoles, !GetAtt PipelineRole.Arn, !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"]
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
        EncryptionKey: { Id: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-KmsKeyArn" }, Type: KMS }
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId: { Category: Source, Owner: AWS, Provider: CodeStarSourceConnection, Version: "1" }
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Sub "${GitHubOwner}/${GitHubRepo}"
                BranchName: !Ref GitHubBranch
                DetectChanges: true
              OutputArtifacts: [{ Name: SourceOutput }]
        - Name: Build
          Actions:
            - Name: LintTestPackage
              ActionTypeId: { Category: Build, Owner: AWS, Provider: CodeBuild, Version: "1" }
              Configuration: { ProjectName: !Ref BuildProject }
              InputArtifacts: [{ Name: SourceOutput }]
              OutputArtifacts: [{ Name: BuildOutput }]
        - Name: DeployStaging
          Actions:
            - Name: CodeDeployInPlace
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CodeDeploy, Version: "1" }
              Configuration:
                ApplicationName: !Ref DeployApplication
                DeploymentGroupName: !Ref StagingDeploymentGroup
              InputArtifacts: [{ Name: BuildOutput }]
        - Name: Approval
          Actions:
            - Name: ProjectLeadApproval
              ActionTypeId: { Category: Approval, Owner: AWS, Provider: Manual, Version: "1" }
              Configuration:
                NotificationArn: !ImportValue { "Fn::Sub": "${ProjectName}-${EnvName}-AlertTopicArn" }
                CustomData: Staging smoke tests passed - approve release to production?
        - Name: DeployProduction
          Actions:
            - Name: CodeDeployBlueGreen
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CodeDeploy, Version: "1" }
              Configuration:
                ApplicationName: !Ref DeployApplication
                DeploymentGroupName: !Ref ProductionDeploymentGroup
              InputArtifacts: [{ Name: BuildOutput }]

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  GitHubConnectionArn:
    Value: !Ref GitHubConnection
    Description: Status starts as PENDING - open Developer Tools > Settings > Connections and click "Update pending connection"
  ArtifactBucketName:
    Value: !Ref ArtifactBucket

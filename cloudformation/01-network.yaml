AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SATC e-commerce platform - Stack 1 of 7: networking. Custom VPC 10.0.0.0/16 across two
  Availability Zones with public, private application and private database subnets, Internet
  Gateway, NAT Gateway(s), route tables, network ACLs, S3/DynamoDB gateway endpoints and VPC Flow Logs.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Naming }
        Parameters: [ProjectName, EnvName]
      - Label: { default: Addressing (CIDR blocks) }
        Parameters: [VpcCidr, PublicSubnet1Cidr, PublicSubnet2Cidr, AppSubnet1Cidr, AppSubnet2Cidr, DataSubnet1Cidr, DataSubnet2Cidr]
      - Label: { default: Cost and logging }
        Parameters: [NatGatewayMode, FlowLogRetentionDays]

Parameters:
  ProjectName:
    Type: String
    Default: satc
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"
  EnvName:
    Type: String
    Default: lab
    AllowedValues: [lab, staging, prod]
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.1.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.2.0/24
  AppSubnet1Cidr:
    Type: String
    Default: 10.0.11.0/24
  AppSubnet2Cidr:
    Type: String
    Default: 10.0.12.0/24
  DataSubnet1Cidr:
    Type: String
    Default: 10.0.21.0/24
  DataSubnet2Cidr:
    Type: String
    Default: 10.0.22.0/24
  NatGatewayMode:
    Type: String
    Default: single
    AllowedValues: [none, single, per-az]
    Description: >
      single = one NAT Gateway in AZ A (lab, about USD 0.045/hour); per-az = one per AZ (production HA);
      none = no NAT (private subnets have no internet egress).
  CreateAdminVpn:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Site-to-site IPsec VPN from the SATC head office for administrative access (about USD 0.05/hour).
  HeadOfficePublicIp:
    Type: String
    Default: 203.0.113.10
    Description: Public IP of the head-office router (customer gateway). 203.0.113.10 is a documentation placeholder.
  HeadOfficeCidr:
    Type: String
    Default: 172.16.0.0/24
  FlowLogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]

Conditions:
  HasNat: !Not [!Equals [!Ref NatGatewayMode, none]]
  HasSecondNat: !Equals [!Ref NatGatewayMode, per-az]
  HasVpn: !Equals [!Ref CreateAdminVpn, "true"]

Resources:
  # ---------------------------------------------------------------- VPC and gateways
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-vpc" }
        - { Key: Project, Value: !Ref ProjectName }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-igw" }

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ---------------------------------------------------------------- subnets (2 AZs x 3 tiers)
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-public-a" }
        - { Key: Tier, Value: public }
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-public-b" }
        - { Key: Tier, Value: public }
  AppSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref AppSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-app-a" }
        - { Key: Tier, Value: app }
  AppSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref AppSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-app-b" }
        - { Key: Tier, Value: app }
  DataSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref DataSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-data-a" }
        - { Key: Tier, Value: data }
  DataSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref DataSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-data-b" }
        - { Key: Tier, Value: data }

  # ---------------------------------------------------------------- public routing
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-rt-public" }
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRouteTable }
  PublicSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRouteTable }

  # ---------------------------------------------------------------- NAT gateways
  NatEip1:
    Type: AWS::EC2::EIP
    Condition: HasNat
    DependsOn: IgwAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-nat-a-eip" }
  NatGateway1:
    Type: AWS::EC2::NatGateway
    Condition: HasNat
    Properties:
      AllocationId: !GetAtt NatEip1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-nat-a" }
  NatEip2:
    Type: AWS::EC2::EIP
    Condition: HasSecondNat
    DependsOn: IgwAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-nat-b-eip" }
  NatGateway2:
    Type: AWS::EC2::NatGateway
    Condition: HasSecondNat
    Properties:
      AllocationId: !GetAtt NatEip2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-nat-b" }

  # ---------------------------------------------------------------- private app routing (one table per AZ)
  AppRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-rt-private-a" }
  AppRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-rt-private-b" }
  AppDefaultRoute1:
    Type: AWS::EC2::Route
    Condition: HasNat
    Properties:
      RouteTableId: !Ref AppRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1
  AppDefaultRoute2:
    Type: AWS::EC2::Route
    Condition: HasNat
    Properties:
      RouteTableId: !Ref AppRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [HasSecondNat, !Ref NatGateway2, !Ref NatGateway1]
  AppSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AppSubnet1, RouteTableId: !Ref AppRouteTable1 }
  AppSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AppSubnet2, RouteTableId: !Ref AppRouteTable2 }

  # ---------------------------------------------------------------- data routing (local only, no internet)
  DataRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-rt-data" }
  DataSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DataSubnet1, RouteTableId: !Ref DataRouteTable }
  DataSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DataSubnet2, RouteTableId: !Ref DataRouteTable }

  # ---------------------------------------------------------------- gateway endpoints (free; keep S3/DynamoDB traffic off the NAT)
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref AppRouteTable1, !Ref AppRouteTable2]
  DynamoDbGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref AppRouteTable1, !Ref AppRouteTable2]

  # ---------------------------------------------------------------- network ACL for the data tier (stateless second layer)
  DataNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-nacl-data" }
  DataNaclInPgApp1:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      CidrBlock: !Ref AppSubnet1Cidr
      PortRange: { From: 5432, To: 5432 }
  DataNaclInPgApp2:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      CidrBlock: !Ref AppSubnet2Cidr
      PortRange: { From: 5432, To: 5432 }
  DataNaclInRedisApp1:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 120
      Protocol: 6
      RuleAction: allow
      CidrBlock: !Ref AppSubnet1Cidr
      PortRange: { From: 6379, To: 6379 }
  DataNaclInRedisApp2:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 130
      Protocol: 6
      RuleAction: allow
      CidrBlock: !Ref AppSubnet2Cidr
      PortRange: { From: 6379, To: 6379 }
  DataNaclInData1:
    # traffic between the two data subnets (e.g. read replica, cache cluster)
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 140
      Protocol: -1
      RuleAction: allow
      CidrBlock: !Ref DataSubnet1Cidr
  DataNaclInData2:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 150
      Protocol: -1
      RuleAction: allow
      CidrBlock: !Ref DataSubnet2Cidr
  DataNaclInEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 200
      Protocol: 6
      RuleAction: allow
      CidrBlock: !Ref VpcCidr
      PortRange: { From: 1024, To: 65535 }
  DataNaclOutVpc:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 100
      Egress: true
      Protocol: -1
      RuleAction: allow
      CidrBlock: !Ref VpcCidr
  DataSubnet1Nacl:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref DataSubnet1, NetworkAclId: !Ref DataNacl }
  DataSubnet2Nacl:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref DataSubnet2, NetworkAclId: !Ref DataNacl }

  # ---------------------------------------------------------------- optional site-to-site VPN (admin access)
  VpnGateway:
    Type: AWS::EC2::VPNGateway
    Condition: HasVpn
    Properties:
      Type: ipsec.1
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-vgw" }
  VpnGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: HasVpn
    Properties:
      VpcId: !Ref Vpc
      VpnGatewayId: !Ref VpnGateway
  CustomerGateway:
    Type: AWS::EC2::CustomerGateway
    Condition: HasVpn
    Properties:
      Type: ipsec.1
      BgpAsn: 65000
      IpAddress: !Ref HeadOfficePublicIp
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-head-office-cgw" }
  VpnConnection:
    Type: AWS::EC2::VPNConnection
    Condition: HasVpn
    Properties:
      Type: ipsec.1
      StaticRoutesOnly: true
      CustomerGatewayId: !Ref CustomerGateway
      VpnGatewayId: !Ref VpnGateway
  VpnStaticRoute:
    Type: AWS::EC2::VPNConnectionRoute
    Condition: HasVpn
    Properties:
      VpnConnectionId: !Ref VpnConnection
      DestinationCidrBlock: !Ref HeadOfficeCidr
  VpnRoutePropagation:
    Type: AWS::EC2::VPNGatewayRoutePropagation
    Condition: HasVpn
    DependsOn: VpnGatewayAttachment
    Properties:
      VpnGatewayId: !Ref VpnGateway
      RouteTableIds: [!Ref AppRouteTable1, !Ref AppRouteTable2]

  # ---------------------------------------------------------------- VPC Flow Logs (to S3, no IAM role needed)
  FlowLogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${EnvName}-flowlogs-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: expire-flow-logs
            Status: Enabled
            ExpirationInDays: !Ref FlowLogRetentionDays
  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: s3
      LogDestination: !GetAtt FlowLogBucket.Arn
      MaxAggregationInterval: 60
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${EnvName}-flowlog" }

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "${ProjectName}-${EnvName}-VpcId" }
  VpcCidr:
    Value: !Ref VpcCidr
    Export: { Name: !Sub "${ProjectName}-${EnvName}-VpcCidr" }
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2]]
    Export: { Name: !Sub "${ProjectName}-${EnvName}-PublicSubnetIds" }
  AppSubnetIds:
    Value: !Join [",", [!Ref AppSubnet1, !Ref AppSubnet2]]
    Export: { Name: !Sub "${ProjectName}-${EnvName}-AppSubnetIds" }
  DataSubnetIds:
    Value: !Join [",", [!Ref DataSubnet1, !Ref DataSubnet2]]
    Export: { Name: !Sub "${ProjectName}-${EnvName}-DataSubnetIds" }
  NatGatewayIp:
    Condition: HasNat
    Value: !Ref NatEip1
    Description: Public IP that payment and shipping partners should allow-list
  FlowLogBucketName:
    Value: !Ref FlowLogBucket
